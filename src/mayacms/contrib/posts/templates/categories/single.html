{% extends "layouts/base.html" %}

{% load i18n %}

{% block content %}

<div class="categories--single">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/" class="text-decoration-none"><i class="fa fa-home"></i> {% trans 'Home' %}</a></li>
            <li class="breadcrumb-item"><a href="{% url 'mayacms.contrib.posts:categories.index' %}" class="text-decoration-none">{% trans 'Categories' %}</a></li>
            <li class="breadcrumb-item active" aria-current="page">{{ category.name }}</li>
        </ol>
    </nav>

    <div class="heading">
        <h4 class="heading-title">{{ category.name }}</h4>
    </div>

    <div class="content">
        {{ category.description|safe }}
    </div>
</div>

{% endblock %}
